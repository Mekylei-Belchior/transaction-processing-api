spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transacaodb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak local - homelab
          jwks-uri: ${OAUTH2_JWKS_URI:https://keycloak.lab.home/realms/bancario/protocol/openid-connect/certs}
          issuer-uri: ${OAUTH2_ISSUER_URI:https://keycloak.lab.home/realms/bancario}

  flyway:
    clean-on-validation-error: false

app:
  rate-limit:
    # limite mais alto para desenvolvimento
    requests-per-minute: 300
  criptografia:
    # Chave de desenvolvimento
    chave: ${APP_CRIPTOGRAFIA_CHAVE:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  hmac:
    # Chave de desenvolvimento
    chave: ${APP_HMAC_CHAVE:xK9mP2vL8nQ5rT1wY4zB7cF3hJ6kU8aR0dG2hN5pS7vL9m}
  eventos:
    kafka:
      enabled: ${EVENTOS_KAFKA_ENABLED:true}

logging:
  level:
    # Pacote da aplicação - nível DEBUG
    # Exibe logs detalhados do código: entrada/saída de métodos, fluxo de processamento,
    # valores de variáveis, etc.
    com.mekylei.transactionprocessing: DEBUG
    # Framework Spring Web - nível DEBUG
    # Mostra detalhes das requisições HTTP: mapeamento de endpoints, parâmetros recebidos,
    # headers, corpo da requisição (se pequeno), e o processo de dispatcher do Spring MVC.
    org.springframework.web: DEBUG
    # Hibernate (core) - nível DEBUG
    # Exibe logs genéricos do Hibernate: abertura/fechamento de sessões, transações,
    # estatísticas, cache de primeiro nível, etc. Ajuda a monitorar o ciclo de vida da
    # sessão e o comportamento geral do ORM.
    org.hibernate: INFO
    # SQL gerado pelo Hibernate - nível DEBUG
    # Mostra exatamente as instruções SQL que o Hibernate envia ao banco de dados.
    # Muito útil para validar se as consultas estão eficientes e corretas, e para
    # detectar problemas como N+1 queries.
    org.hibernate.SQL: INFO
    # Parâmetros bindados nas consultas SQL - nível TRACE
    # Exibe os valores que são substituídos nos placeholders (?) das queries SQL.
    # Como contém dados sensíveis (ex: valores de transações), o nível TRACE é mais
    # detalhado que DEBUG. Ideal para depurar parâmetros de consultas dinâmicas,
    # mas deve ser evitado em produção por questões de segurança e volume de logs.
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # Exibe a execução completa da cadeia de filtros de segurança: qual filtro
    # processou a requisição, resultado da validação JWT (expiração, issuer,
    # assinatura), e decisões de autorização (@PreAuthorize / hasRole).
    # Essencial para diagnosticar erros de autenticação (401) e acesso negado (403)
    # ATENÇÃO: logs contêm detalhes do token e decisões de acesso — NUNCA habilitar em produção.
    org.springframework.security: DEBUG

    org.apache.kafka: WARN
    org.springframework.kafka: WARN

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

antifraude:
  limite-aprovacao-automatica: ${ANTIFRAUDE_LIMITE_APROVACAO_AUTOMATICA:10000.00}