server:
  port: ${PORT:8081}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true

logging:
  level:
    com.mekylei.transactionprocessing: INFO    # Apenas informações importantes
    org.springframework.web: WARN              # Só alertas e erros
    org.hibernate: WARN                        # Silencia logs do Hibernate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false